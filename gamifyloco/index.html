<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gamifyloco</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 35px;
            background: #f1f4f9;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            margin: auto;
        }

        button {
            padding: 13px 22px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Cybersecurity Location Experiment</h2>

    <p>
        This educational experiment demonstrates
        how websites access browser geolocation.
    </p>

    <p>
        Your coordinates will be sent to the
        researcher's Supabase database only if
        you agree and grant location permission.
    </p>

    <label>
        <input type="checkbox" id="consent">
        I understand and agree to share my location.
    </label>

    <br><br>

    <button onclick="shareLocation()">
        Share My Location
    </button>

    <p id="status"></p>

</div>

<script>

const supabase = window.supabase.createClient(
    "https://phroujtuilskvjzphpty.supabase.co",
    "sb_publishable_hwPtngV2FZxzy73xPY2Cew_iYaCfr4q"
);

async function shareLocation() {

    const status = document.getElementById("status");

    if (!document.getElementById("consent").checked) {
        status.innerText = "Please provide consent first.";
        return;
    }

    if (!navigator.geolocation) {
        status.innerText = "Geolocation unavailable.";
        return;
    }

    status.innerText = "Requesting location permission...";

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const data = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy_m: position.coords.accuracy,
                consent: true
            };

            const { error } = await supabase
                .from("location_demo")
                .insert(data);

            if (error) {
                status.innerText =
                    "Database error: " + error.message;
                return;
            }

            status.innerHTML =
                "Location successfully submitted!<br>" +
                "Latitude: " + data.latitude + "<br>" +
                "Longitude: " + data.longitude + "<br>" +
                "Accuracy: " + data.accuracy_m + " meters";

        },

        function(error) {

            status.innerText =
                "Location unavailable or permission denied.";

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );
}

</script>

</body>
</html>
